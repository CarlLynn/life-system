<!DOCTYPE html>
<html lang="zh-CN" data-theme="youth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 人生养成系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;background:radial-gradient(600px 400px at 90% -10%,rgba(168,85,247,.28),transparent 60%),radial-gradient(500px 420px at -10% 20%,rgba(244,114,182,.20),transparent 60%),#0f0926;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#f4f1ff;padding:24px;text-align:center}
.card{max-width:420px}
.code{font-family:'JetBrains Mono',Consolas,monospace;font-size:5rem;font-weight:700;background:linear-gradient(120deg,#f472b6,#a78bfa,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.title{font-size:1.1rem;margin:16px 0 8px;letter-spacing:.1em}
.sub{font-size:.8rem;color:#c9c2e8;line-height:1.8;margin-bottom:28px}
.btn{display:inline-block;padding:12px 28px;border-radius:12px;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;text-decoration:none;font-size:.9rem;font-weight:600;box-shadow:0 6px 20px rgba(236,72,153,.35)}
.btn:hover{transform:translateY(-1px)}
.foot{margin-top:32px;font-family:'JetBrains Mono',monospace;font-size:.62rem;color:#6f6696}
</style>
</head>
<body>
<div class="card">
  <div class="code">404</div>
  <div class="title">这条路径不在系统收录范围内</div>
  <div class="sub">链接可能已失效，或你输错了地址。<br>人生只有 36,500 天，别在这里停留太久。</div>
  <a class="btn" href="index.html">🎮 返回系统</a>
  <div class="foot">LIFE SYSTEM v5.2 · 数据仅存本地</div>
</div>
</body>
</html>
